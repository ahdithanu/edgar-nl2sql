# Weekly earnings-call transcript refresh.
#
# Runs scripts/load_transcripts.py against a priority list on a schedule. The
# loader is resumable and idempotent: a (company, quarter) already in the DB is
# skipped BEFORE any API call, so each run spends the Alpha Vantage free-tier
# quota (25 req/day) only on genuinely new transcripts — newly-reported quarters
# for companies already loaded, plus companies still on the backlog. When the
# daily quota is hit, Alpha Vantage returns a throttle notice and the loader
# stops cleanly (exit 0), carrying the remainder to next week's run.
#
# Scheduled workflows run from the DEFAULT branch, so this activates once merged
# to main. Trigger a one-off anytime from the Actions tab (workflow_dispatch),
# optionally overriding the ticker list / depth / pacing.

name: Transcripts refresh

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers"
        default: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,JPM,WMT,XOM,JNJ,V,UNH,BAC,KO,PEP,HD,PG,DIS,NFLX,MA,CVX,COST"
      last:
        description: "Most recent N quarters per company"
        default: "2"
      sleep:
        description: "Seconds between API calls (free tier: 13)"
        default: "13"

permissions:
  contents: read

# Never let two refreshes overlap (they'd double-spend the daily quota).
concurrency:
  group: transcripts-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Backfill earnings-call transcripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Skip gracefully (not red) when the secrets aren't configured — e.g. a
      # fork, or before ALPHAVANTAGE_API_KEY has been added.
      - name: Check secrets
        id: check
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          if [ -n "$ALPHAVANTAGE_API_KEY" ] && [ -n "$DATABASE_URL" ] && [ -n "$VOYAGE_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Transcript secrets not configured — skipping refresh."
          fi

      - name: Install package
        if: steps.check.outputs.ok == 'true'
        run: pip install -e ".[dev]"

      - name: Refresh transcripts (resumable; stops cleanly at the daily quota)
        if: steps.check.outputs.ok == 'true'
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          python scripts/load_transcripts.py \
            --tickers "${{ github.event.inputs.tickers || 'AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,JPM,WMT,XOM,JNJ,V,UNH,BAC,KO,PEP,HD,PG,DIS,NFLX,MA,CVX,COST' }}" \
            --last "${{ github.event.inputs.last || '2' }}" \
            --sleep "${{ github.event.inputs.sleep || '13' }}"
